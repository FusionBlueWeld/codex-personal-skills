<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#f6f7f9">
  <title>モビシロ・スライド</title>
  <style>
    :root {
      color-scheme: light;
      --ink: #17191f;
      --muted: #747983;
      --panel: #ffffff;
      --line: #e6e8ec;
      --accent: #2e67d1;
      --slide-width: min(430px, 88vw, 42.75dvh);
    }

    * { box-sizing: border-box; }
    html, body { min-height: 100%; }

    body {
      margin: 0;
      min-height: 100dvh;
      overflow-x: hidden;
      background: #f6f7f9;
      color: var(--ink);
      font-family: ui-sans-serif, -apple-system, BlinkMacSystemFont, "Segoe UI", "Hiragino Sans", "Yu Gothic", sans-serif;
      letter-spacing: .02em;
    }

    .shell {
      min-height: 100dvh;
      padding: max(14px, env(safe-area-inset-top)) 16px max(18px, env(safe-area-inset-bottom));
      display: grid;
      place-items: center;
      align-content: center;
      gap: 12px;
    }

    .topbar,
    .footer {
      width: min(100%, 430px);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .topbar {
      color: var(--muted);
      font-size: 11px;
      text-transform: uppercase;
      letter-spacing: .14em;
    }

    .brand {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      color: var(--ink);
      font-weight: 700;
    }

    .brand::before {
      content: "";
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background: var(--accent);
    }

    .deck {
      width: var(--slide-width);
      aspect-ratio: 9 / 16;
      max-width: 100%;
      display: flex;
      overflow-x: auto;
      overflow-y: hidden;
      scroll-snap-type: x mandatory;
      scrollbar-width: none;
      overscroll-behavior-x: contain;
      border: 1px solid var(--line);
      border-radius: 24px;
      background: var(--panel);
      box-shadow: 0 16px 40px rgba(25, 32, 45, .10);
    }

    .deck::-webkit-scrollbar { display: none; }

    .slide {
      flex: 0 0 100%;
      min-width: 100%;
      height: 100%;
      padding: 9%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow: hidden;
      scroll-snap-align: start;
      background: #ffffff;
    }

    .eyebrow {
      margin: 0;
      padding-bottom: 14px;
      border-bottom: 1px solid var(--line);
      color: var(--accent);
      font-size: clamp(10px, 2.5vw, 12px);
      font-weight: 800;
      letter-spacing: .15em;
      text-transform: uppercase;
    }

    h1,
    h2 {
      max-width: 100%;
      margin: 14% 0 0;
      font-size: clamp(30px, 8.7vw, 40px);
      line-height: 1.02;
      letter-spacing: -.065em;
    }

    .lead {
      max-width: 28ch;
      margin: 9% 0 0;
      color: var(--muted);
      font-size: clamp(13px, 3.5vw, 16px);
      line-height: 1.75;
    }

    .slide-number {
      margin: 0;
      color: var(--muted);
      font-size: 11px;
      letter-spacing: .14em;
    }

    .footer { gap: 12px; }
    .hint { color: var(--muted); font-size: 11px; }
    .dots { display: flex; gap: 7px; }

    .dot {
      width: 7px;
      height: 7px;
      padding: 0;
      border: 0;
      border-radius: 50%;
      background: #d3d7df;
      cursor: pointer;
    }

    .dot[aria-current="true"] {
      width: 22px;
      border-radius: 99px;
      background: var(--accent);
    }

    @media (min-width: 700px) {
      :root { --slide-width: 360px; }
      .shell { padding-top: 28px; padding-bottom: 28px; }
    }
  </style>
</head>
<body>
  <main class="shell">
    <div class="topbar">
      <span class="brand">Mobishiro</span>
      <span>mobile deck / 9:16</span>
    </div>

    <section class="deck">
      <!-- SLIDES_START: この範囲の article.slide を追加・削除・編集する -->
      <article class="slide">
        <div>
          <p class="eyebrow">OVERVIEW / 01</p>
          <h1>白を基調にした、<br>シンプルな資料。</h1>
          <p class="lead">ここに最初のスライドの短い説明を記載します。</p>
        </div>
        <p class="slide-number"></p>
      </article>

      <article class="slide">
        <div>
          <p class="eyebrow">POINT / 02</p>
          <h2>ひとつの要点を、<br>一枚で伝える。</h2>
          <p class="lead">情報を絞り、スマホで流し見しても追いやすい文章量にします。</p>
        </div>
        <p class="slide-number"></p>
      </article>

      <article class="slide">
        <div>
          <p class="eyebrow">NEXT / 03</p>
          <h2>次の行動を、<br>明確に示す。</h2>
          <p class="lead">最後のスライドには結論や次のステップを配置します。</p>
        </div>
        <p class="slide-number"></p>
      </article>
      <!-- SLIDES_END -->
    </section>

    <div class="footer">
      <span class="hint">← swipe →</span>
      <nav class="dots" aria-label="ページ選択"></nav>
    </div>
  </main>

  <script>
    const deck = document.querySelector('.deck');
    const slides = [...document.querySelectorAll('.slide')];
    const dotsNav = document.querySelector('.dots');
    const pad = value => String(value).padStart(2, '0');

    deck.setAttribute('aria-label', `${slides.length}ページのスライド資料`);

    const dots = slides.map((slide, index) => {
      const page = index + 1;
      slide.setAttribute('aria-label', `${page}ページ目`);
      const number = slide.querySelector('.slide-number');
      if (number) number.textContent = `${pad(page)} / ${pad(slides.length)}`;

      const dot = document.createElement('button');
      dot.className = 'dot';
      dot.type = 'button';
      dot.setAttribute('aria-label', `${page}ページ目へ`);
      dot.setAttribute('aria-current', String(index === 0));
      dotsNav.append(dot);
      return dot;
    });

    function currentIndex() {
      return Math.round(deck.scrollLeft / deck.clientWidth);
    }

    function goToSlide(index) {
      const next = Math.max(0, Math.min(index, slides.length - 1));
      deck.scrollTo({ left: deck.clientWidth * next, behavior: 'smooth' });
    }

    function syncDots() {
      const active = currentIndex();
      dots.forEach((dot, index) => dot.setAttribute('aria-current', String(index === active)));
    }

    dots.forEach((dot, index) => dot.addEventListener('click', () => goToSlide(index)));
    deck.addEventListener('scroll', syncDots, { passive: true });

    document.addEventListener('keydown', event => {
      if (event.key === 'ArrowRight') goToSlide(currentIndex() + 1);
      if (event.key === 'ArrowLeft') goToSlide(currentIndex() - 1);
    });
  </script>
</body>
</html>
